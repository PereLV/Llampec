name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test without changing the desktop or display topology
        run: dotnet test tests/Llampec.Core.Tests -c Release --filter "FullyQualifiedName!~ActionCatalogTests&FullyQualifiedName!~HdrDisplaysTests&FullyQualifiedName!~ProjectionModesTests"

  build:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Package (${{ matrix.rid }})
        run: ./tools/package.ps1 -RuntimeIdentifier ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: Llampec-${{ matrix.rid }}
          path: publish/*.zip
          if-no-files-found: error
