name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/Llampec.Core.Tests --configuration Release --no-build
      - name: Publish (${{ matrix.rid }})
        run: dotnet publish src/Llampec.App -c Release -r ${{ matrix.rid }} --self-contained false -o artifacts/${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: Llampec-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
